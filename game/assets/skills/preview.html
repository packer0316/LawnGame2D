<!doctype html>
<html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>技能特效 · 動畫原畫</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0b1020;color:#e9e5f6;font:15px system-ui,sans-serif}main{max-width:1050px;margin:auto;padding:32px 24px}small{color:#ac9ac7;letter-spacing:.15em}h1{font-size:28px;margin:10px 0}p{color:#a9afc1;line-height:1.7}nav{display:flex;gap:8px;flex-wrap:wrap;margin:24px 0}button{background:#192239;color:#d9e4f8;border:1px solid #34445d;border-radius:8px;padding:10px 16px;cursor:pointer}button[aria-pressed=true]{background:#463360;border-color:#c0a2e5;color:white}.stage{background:radial-gradient(ellipse at 50% 70%,#263447,#111829 65%);border:1px solid #34445d;border-radius:16px;overflow:hidden}canvas{display:block;width:100%;height:auto}.controls{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin:18px 0}input[type=range]{accent-color:#b4a0ff;flex:1;min-width:140px}output{font-variant-numeric:tabular-nums;min-width:130px}.note{min-height:52px}a{color:#b2cef0}
</style>
<main><small>LAWN / SKILL ART</small><h1>逐幀技能特效</h1><p>檢查完整原畫、蓄勢與收勢。遊戲中的命中火花、鏡頭與聲音由技能事件另行搭配。</p>
<nav id="sheets"></nav><div class="stage"><canvas id="stage" width="1000" height="580"></canvas></div>
<div class="controls"><button id="toggle">暫停</button><button id="flip">朝向：右</button><label>速度 <select id="speed"><option value=".5">0.5×</option><option value="1" selected>1×</option><option value="1.5">1.5×</option></select></label><input id="frame" aria-label="動畫格" type="range" min="0" max="11" value="0"><output id="position"></output></div>
<p id="note" class="note"></p><p><a href="README.md">技能描述與接入紀錄</a></p></main>
<script>
const definitions=[['reaper','死神召喚',3],['blade','月牙刀光',2],['fire','火焰爆破',2],['arcane','冰晶法陣',2],['shadow','暗影交叉斬',2],['earth','劍士 · 地裂岩刺',2],['dragon','劍士 · 青龍昇空',2],['lightning','法師 · 分岔雷電',2],['soul','法師 · 冥界噬魂',2]];
const canvas=document.getElementById('stage'),c=canvas.getContext('2d'),slider=document.getElementById('frame');
let sheet,rows=3,current=0,playing=true,flipped=false,elapsed=0,last=performance.now(),selection='reaper',generation=0;
async function select([id,label,r]){const request=++generation;selection=id;rows=r;current=0;elapsed=0;slider.max=r*4-1;sheet=null;const image=new Image();image.src=id+'-sequence'+(['earth','dragon','lightning','soul'].includes(id)?'-v4':'')+'.png';try{await image.decode();if(request!==generation)return;sheet=image;}catch{document.getElementById('note').textContent='素材載入失敗，請確認 PNG 與預覽頁放在同一目錄。';}document.querySelectorAll('nav button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.id===id)));}
for(const d of definitions){const b=document.createElement('button');b.textContent=d[1];b.dataset.id=d[0];b.onclick=()=>select(d);document.getElementById('sheets').append(b);}
document.getElementById('toggle').onclick=()=>{playing=!playing;document.getElementById('toggle').textContent=playing?'暫停':'播放';};
document.getElementById('flip').onclick=()=>{flipped=!flipped;document.getElementById('flip').textContent=flipped?'朝向：左':'朝向：右';};
slider.oninput=()=>{current=Number(slider.value);elapsed=0;playing=false;document.getElementById('toggle').textContent='播放';};
function tick(now){const dt=Math.min(100,now-last);last=now;const duration=selection==='reaper'?(current===5?180:current===9?180:80):70;if(playing){elapsed+=dt*Number(document.getElementById('speed').value);if(elapsed>duration){elapsed-=duration;current=(current+1)%(rows*4);}}c.clearRect(0,0,1000,580);c.strokeStyle='#45556b';c.beginPath();c.moveTo(80,510);c.lineTo(920,510);c.stroke();if(sheet){const x=Math.floor(current%4*sheet.width/4),y=Math.floor(Math.floor(current/4)*sheet.height/rows),w=Math.floor((current%4+1)*sheet.width/4)-x,h=Math.floor((Math.floor(current/4)+1)*sheet.height/rows)-y;c.save();c.translate(500,510);c.scale(flipped?-1:1,1);c.drawImage(sheet,x,y,w,h,-225,-450,450,450);c.restore();document.getElementById('note').textContent=selection==='reaper'?(current<6?'現身與蓄勢：0–5 格，遊戲會在舉鐮姿勢等候命中事件。':current<10?'揮鐮與收勢：6–9 格，由五次 reaperSweep 事件分別啟動。':'消散：10–11 格，由 darkBurst 事件啟動。'):'由凝聚、爆發到殘光消散的 8 格原畫；遊戲疊加拖尾、命中火花與光源。';}slider.value=current;document.getElementById('position').textContent=`格 ${current} / ${rows*4-1}`;requestAnimationFrame(tick);}select(definitions[0]);requestAnimationFrame(tick);
</script></html>
